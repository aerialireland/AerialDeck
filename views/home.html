<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AerialDeck</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#97D49F">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Variables copied from public/index.html so the portal matches the rest of
       AerialDeck exactly. If the palette changes there, mirror it here. */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8faf8;
      --bg-card: #ffffff;
      --text-primary: #001803;
      --text-secondary: #3d5a40;
      --text-muted: #6b8a6e;
      --accent: #6ba671;
      --accent-light: #e8f5e9;
      --accent-dark: #4a8550;
      --border: #e0e8e0;
      --border-light: #f0f4f0;
    }

    body.dark {
      --bg-primary: #1c1c1c;
      --bg-secondary: #141414;
      --bg-card: #212121;
      --text-primary: #e3e3e3;
      --text-secondary: #aaaaaa;
      --text-muted: #737373;
      --accent: #6ba671;
      --accent-light: #1e2e20;
      --accent-dark: #8bc895;
      --border: #303030;
      --border-light: #272727;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .portal {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      /* Nudged up a little: dead-centre reads as slightly low on a tall screen. */
      margin-top: -4vh;
    }

    .portal-logo {
      width: min(360px, 70vw);
      height: auto;
      display: block;
      margin-bottom: clamp(2.5rem, 7vh, 4.5rem);
    }

    .cards { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

    .card {
      display: block;
      line-height: 0;
      width: 120px;
      border-radius: 22%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 3px 10px rgba(0, 24, 3, 0.10);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(0, 24, 3, 0.18);
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .card img { width: 100%; height: auto; display: block; border-radius: inherit; }

    /* External links. Same size as the two AerialDeck sections above — the
       divider is what separates them. */
    .links {
      margin-top: clamp(1.75rem, 4.5vh, 2.75rem);
      padding-top: clamp(1.75rem, 4.5vh, 2.75rem);
      border-top: 1px solid var(--border);
      width: 100%;
    }

    /* Sign Out lived in the top bar, which is gone — now a power icon in the
       corner, matching the treatment in the Claude Design concept. */
    .signout {
      position: fixed;
      top: 28px;
      right: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }
    .signout:hover { background: rgba(0, 24, 3, 0.06); }
    body.dark .signout:hover { background: rgba(255, 255, 255, 0.08); }
    .signout:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 520px) {
      .cards { gap: 1.25rem; }
      .card { width: 104px; }
    }
  </style>
</head>
<body>

  <button class="signout" id="logoutBtn" aria-label="Sign out" title="Sign out">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v10"></path>
      <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
    </svg>
  </button>

  <main class="portal">

    <img class="portal-logo" src="/logo.png" alt="AerialDeck">

    <div class="cards">
      <a class="card" href="/uf101">
        <img src="/icon-uf101-creator.png" alt="U.F.101 Creator" width="512" height="512">
      </a>

      <a class="card" href="/">
        <img src="/icon-flight-planner.png" alt="Flight Planner" width="512" height="512">
      </a>
    </div>

    <!-- External sites. All open in a new tab so the portal stays put.
         rel="noopener" is required with target="_blank": without it the opened
         page gets a handle on this one via window.opener. -->
    <div class="links">
      <div class="cards">

        <a class="card" href="https://www.iaa.ie/general-aviation/drones/uas-geographic-zones"
           target="_blank" rel="noopener noreferrer" title="IAA UAS Geographic Zones">
          <img src="/tool-icons/iaa-geozones.png" alt="IAA Geozones" width="512" height="512">
        </a>

        <a class="card" href="https://www.iaa.ie/general-aviation/drones/operational-authorisation"
           target="_blank" rel="noopener noreferrer" title="IAA Operational Authorisation holders">
          <img src="/tool-icons/iaa-oa-holders.png" alt="IAA OA Holders" width="512" height="512">
        </a>

        <a class="card" href="https://aviationreporting.eu/en"
           target="_blank" rel="noopener noreferrer" title="ECCAIRS 2 — occurrence reporting">
          <img src="/tool-icons/eccairs-reports.png" alt="ECCAIRS Reports" width="512" height="512">
        </a>

        <a class="card" href="https://www.aerial.ie/"
           target="_blank" rel="noopener noreferrer" title="Aerial website">
          <img src="/tool-icons/aerial-website.png" alt="Aerial Website" width="512" height="512">
        </a>

      </div>
    </div>

  </main>

  <script>
    // Match the dark-mode preference set in the Flight Plan section. Same
    // localStorage key, so the choice carries across both sections.
    if (localStorage.getItem('aerialDeckDarkMode') === '1') {
      document.body.classList.add('dark');
    }

    // The server already redirects unauthenticated visitors to the login page,
    // so this is a second line of defence for a session that expires while the
    // page is open.
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (!data.authenticated) window.location.href = '/';
      } catch (e) { /* offline — leave the page as it is */ }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>

</body>
</html>
