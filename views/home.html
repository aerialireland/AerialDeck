<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AerialDeck</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#97D49F">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Variables copied from public/index.html so the portal matches the rest of
       AerialDeck exactly. If the palette changes there, mirror it here. */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8faf8;
      --bg-card: #ffffff;
      --text-primary: #001803;
      --text-secondary: #3d5a40;
      --text-muted: #6b8a6e;
      --accent: #6ba671;
      --accent-light: #e8f5e9;
      --accent-dark: #4a8550;
      --border: #e0e8e0;
      --border-light: #f0f4f0;
    }

    body.dark {
      --bg-primary: #1c1c1c;
      --bg-secondary: #141414;
      --bg-card: #212121;
      --text-primary: #e3e3e3;
      --text-secondary: #aaaaaa;
      --text-muted: #737373;
      --accent: #6ba671;
      --accent-light: #1e2e20;
      --accent-dark: #8bc895;
      --border: #303030;
      --border-light: #272727;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Shows through until the video paints, and stands in if it fails. */
      background: #001803;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Background video, full-bleed behind everything. */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      /* Chrome occasionally leaves a hairline of page background at the edges
         on fractional-DPI displays; a hair of scale hides it. */
      transform: scale(1.01);
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
      pointer-events: none;
    }

    .portal {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      /* Nudged up a little: dead-centre reads as slightly low on a tall screen. */
      margin-top: -4vh;
    }

    .portal-logo {
      width: min(360px, 70vw);
      height: auto;
      display: block;
      margin-bottom: clamp(2.5rem, 7vh, 4.5rem);
    }

    .cards { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

    .card {
      display: block;
      line-height: 0;
      width: 120px;
      border-radius: 22%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 3px 10px rgba(0, 24, 3, 0.10);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .card:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
    .card img { width: 100%; height: auto; display: block; border-radius: inherit; }

    /* External links. Same size as the two AerialDeck sections above — the
       divider is what separates them. */
    .links {
      margin-top: clamp(1.75rem, 4.5vh, 2.75rem);
      padding-top: clamp(1.75rem, 4.5vh, 2.75rem);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      width: 100%;
    }

    /* Sign Out lived in the top bar, which is gone — now a power icon in the
       corner, matching the treatment in the Claude Design concept. */
    .signout {
      position: fixed;
      top: 28px;
      right: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }
    .signout:hover { color: #ffffff; background: rgba(255, 255, 255, 0.12); }
    .signout:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

    @media (max-width: 520px) {
      .cards { gap: 1.25rem; }
      .card { width: 104px; }
    }

    /* Motion off: hold the poster frame rather than playing. Handled in JS too,
       so the video never even starts downloading. */
    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      .bg-overlay {
        background:
          linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
          url('/video/wicklow-poster.jpg') center / cover no-repeat;
      }
    }
  </style>
</head>
<body>

  <!-- muted + playsinline are what make autoplay legal in browsers; without both
       it is blocked and you get a frozen first frame. The poster covers the gap
       before the first frame decodes. -->
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline
         preload="auto" poster="/video/wicklow-poster.jpg" aria-hidden="true" tabindex="-1">
    <!-- WebM first: some Chromium builds ship without the proprietary H.264
         decoder and will silently stall on the MP4 forever rather than error.
         Safari and iOS don't take VP9 here, so they fall through to the MP4. -->
    <source src="/video/wicklow.webm" type="video/webm">
    <source src="/video/wicklow.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <button class="signout" id="logoutBtn" aria-label="Sign out" title="Sign out">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v10"></path>
      <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
    </svg>
  </button>

  <main class="portal">

    <img class="portal-logo" src="/logo.png" alt="AerialDeck">

    <div class="cards">
      <a class="card" href="/uf101">
        <img src="/icon-uf101-creator.png" alt="U.F.101 Creator" width="512" height="512">
      </a>

      <a class="card" href="/">
        <img src="/icon-flight-planner.png" alt="Flight Planner" width="512" height="512">
      </a>
    </div>

    <!-- External sites. All open in a new tab so the portal stays put.
         rel="noopener" is required with target="_blank": without it the opened
         page gets a handle on this one via window.opener. -->
    <div class="links">
      <div class="cards">

        <a class="card" href="https://www.iaa.ie/general-aviation/drones/uas-geographic-zones"
           target="_blank" rel="noopener noreferrer" title="IAA UAS Geographic Zones">
          <img src="/tool-icons/iaa-geozones.png" alt="IAA Geozones" width="512" height="512">
        </a>

        <a class="card" href="https://www.iaa.ie/general-aviation/drones/operational-authorisation"
           target="_blank" rel="noopener noreferrer" title="IAA Operational Authorisation holders">
          <img src="/tool-icons/iaa-oa-holders.png" alt="IAA OA Holders" width="512" height="512">
        </a>

        <a class="card" href="https://dahg.maps.arcgis.com/apps/webappviewer/index.html?id=8f7060450de3485fa1c1085536d477ba"
           target="_blank" rel="noopener noreferrer" title="NPWS designated sites map">
          <img src="/tool-icons/npws-zones.png" alt="NPWS Zones" width="512" height="512">
        </a>

        <a class="card" href="https://aviationreporting.eu/en"
           target="_blank" rel="noopener noreferrer" title="ECCAIRS 2 — occurrence reporting">
          <img src="/tool-icons/eccairs-reports.png" alt="ECCAIRS Reports" width="512" height="512">
        </a>

        <a class="card" href="https://www.aerial.ie/"
           target="_blank" rel="noopener noreferrer" title="Aerial website">
          <img src="/tool-icons/aerial-website.png" alt="Aerial Website" width="512" height="512">
        </a>

      </div>
    </div>

  </main>

  <script>
    // The page sits on the video, so it is dark either way — no dark-mode class
    // to apply here.

    (function backgroundVideo() {
      var v = document.getElementById('bgVideo');
      if (!v) return;

      // Don't even fetch 1.3MB if the user has asked for less motion.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        v.removeAttribute('autoplay');
        v.pause();
        v.removeAttribute('src');
        while (v.firstChild) v.removeChild(v.firstChild);
        return;
      }

      // Some browsers still refuse autoplay (low power mode, data saver). The
      // poster stays up in that case, which is a fine outcome — but retry once
      // on the first interaction, which browsers do accept.
      var p = v.play();
      if (p && p.catch) {
        p.catch(function () {
          var retry = function () {
            v.play().catch(function () {});
            document.removeEventListener('pointerdown', retry);
          };
          document.addEventListener('pointerdown', retry, { once: true });
        });
      }

      // No point decoding video for a tab nobody is looking at.
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) v.pause();
        else v.play().catch(function () {});
      });
    })();

    // The server already redirects unauthenticated visitors to the login page,
    // so this is a second line of defence for a session that expires while the
    // page is open.
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (!data.authenticated) window.location.href = '/';
      } catch (e) { /* offline — leave the page as it is */ }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>

</body>
</html>
