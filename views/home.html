<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AerialDeck</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#97D49F">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Variables copied from public/index.html so the portal matches the rest of
       AerialDeck exactly. If the palette changes there, mirror it here. */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8faf8;
      --bg-card: #ffffff;
      --text-primary: #001803;
      --text-secondary: #3d5a40;
      --text-muted: #6b8a6e;
      --accent: #6ba671;
      --accent-light: #e8f5e9;
      --accent-dark: #4a8550;
      --border: #e0e8e0;
      --border-light: #f0f4f0;
    }

    body.dark {
      --bg-primary: #1c1c1c;
      --bg-secondary: #141414;
      --bg-card: #212121;
      --text-primary: #e3e3e3;
      --text-secondary: #aaaaaa;
      --text-muted: #737373;
      --accent: #6ba671;
      --accent-light: #1e2e20;
      --accent-dark: #8bc895;
      --border: #303030;
      --border-light: #272727;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { height: 44px; width: auto; }
    .header-actions { display: flex; gap: 1rem; align-items: center; }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
    }
    .logout-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }

    .portal {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .portal-intro { margin-bottom: 2.5rem; }
    .portal-intro h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .portal-intro p { color: var(--text-muted); font-size: 1rem; }

    /* App-icon tiles. The artwork is Rob's 512x512 PNGs, shown at 260px so they
       stay under their native resolution and keep a crisp edge on retina. */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 260px);
      gap: 2rem;
    }

    .card {
      display: block;
      line-height: 0;
      border-radius: 22%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 24, 3, 0.10);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0, 24, 3, 0.18);
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .card img { width: 100%; height: auto; display: block; border-radius: inherit; }

    @media (max-width: 720px) {
      .cards { grid-template-columns: 260px; justify-content: center; }
      .portal { padding: 2rem 1.25rem 3rem; }
      .header { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <img src="/logo.png" alt="Aerial" class="header-logo">
    <div class="header-actions">
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <main class="portal">
    <div class="portal-intro">
      <h1>AerialDeck</h1>
      <p>Flight planning, record keeping and airspace applications.</p>
    </div>

    <div class="cards">

      <a class="card" href="/uf101">
        <img src="/icon-uf101-creator.png" alt="U.F.101 Creator" width="512" height="512">
      </a>

      <a class="card" href="/">
        <img src="/icon-flight-planner.png" alt="Flight Planner" width="512" height="512">
      </a>

    </div>
  </main>

  <script>
    // Match the dark-mode preference set in the Flight Plan section. Same
    // localStorage key, so the choice carries across both sections.
    if (localStorage.getItem('aerialDeckDarkMode') === '1') {
      document.body.classList.add('dark');
    }

    // The server already redirects unauthenticated visitors to the login page,
    // so this is a second line of defence for a session that expires while the
    // page is open.
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (!data.authenticated) window.location.href = '/';
      } catch (e) { /* offline — leave the page as it is */ }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>

</body>
</html>
