                            <a className="header-link" href="/home">AerialDeck</a>
                            <button className="logout-btn" onClick={async () => {
                                await fetch('/api/logout', { method: 'POST' });
                                window.location.href = '/';
                            }}>Sign Out</button>
                        </div>
                    </header>

                    {/* Save Modal */}
                    {showSaveModal && (
                        <div className="modal-overlay" onClick={() => setShowSaveModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h3>New Flight Application</h3>
                                <div className="form-group">
                                    <label>Flight Name</label>
                                    <input type="text" value={saveName} onChange={(e) => setSaveName(e.target.value)} placeholder="Enter a name for this flight..." autoFocus onKeyDown={(e) => e.key === 'Enter' && confirmSave()} />
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-secondary" onClick={() => setShowSaveModal(false)}>Cancel</button>
                                    <button className="btn btn-success" onClick={confirmSave}>Create</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Rename Modal */}
                    {showRenameModal && (
                        <div className="modal-overlay" onClick={() => setShowRenameModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h3>Rename Flight</h3>
                                <div className="form-group">
                                    <label>Flight Name</label>
                                    <input type="text" value={renameName} onChange={(e) => setRenameName(e.target.value)} placeholder="Enter new name..." autoFocus onKeyDown={(e) => e.key === 'Enter' && confirmRename()} />
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-secondary" onClick={() => setShowRenameModal(false)}>Cancel</button>
                                    <button className="btn btn-success" onClick={confirmRename}>Rename</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Layout - 3 columns */}
                    <div className="main-layout">
                        {/* Sidebar */}
                        <div className="sidebar">
                            <div className="sidebar-header">
                                <span>📁 Flights</span>
                                <div style={{display: 'flex', gap: '8px', alignItems: 'center'}}>
                                    <input
                                        type="text"
                                        placeholder="Search..."
                                        value={flightSearch}
                                        onChange={(e) => setFlightSearch(e.target.value)}
                                        className="sidebar-search"
                                    />
                                    <button className="btn btn-sm" onClick={() => { setSaveName(''); setShowSaveModal(true); }} style={{background: 'var(--accent)', color: '#fff'}}>+ New</button>
                                </div>
                            </div>
                            <div className="sidebar-flights">
                                {savedFlights.length === 0 ? (
                                    <div className="sidebar-empty">
                                        <div style={{fontSize: '32px', marginBottom: '12px'}}>📋</div>
                                        <div>No saved flights</div>
                                        <div style={{marginTop: '8px', fontSize: '12px'}}>Click + New to create one</div>
                                    </div>
                                ) : (
                                    savedFlights.filter(flight =>
                                        flight.name.toLowerCase().includes(flightSearch.toLowerCase()) ||
                                        (flight.zoneName && flight.zoneName.toLowerCase().includes(flightSearch.toLowerCase()))
                                    ).map(flight => (
                                        <div key={flight.id} className={"sidebar-flight" + (currentFlightId === flight.id ? " active" : "")} onClick={() => loadFlight(flight.id)}>
                                            <div className="sidebar-flight-name">{flight.name}</div>
                                            <div className="sidebar-flight-meta">{flight.zoneName || 'No zone'} • {new Date(flight.savedAt).toLocaleDateString()}</div>
                                            {flight.geojsonVersion && (
                                                <div className="sidebar-flight-geojson" style={{fontSize: '0.68rem', color: 'var(--text-muted)', marginTop: '0.35rem'}}>
                                                    📄 {flight.geojsonVersion.name?.replace('UAS Geographical Zones Ireland ', 'IAA ') || 'Unknown version'}
                                                    <a href={'/uf101/geojson-archive/' + (flight.geojsonVersion.name?.match(/\d{8}V\d+/)?.[0] || 'unknown') + '.geojson'}
                                                       download
                                                       onClick={(e) => e.stopPropagation()}
                                                       style={{marginLeft: '0.5rem', color: 'var(--accent-dark)', textDecoration: 'underline'}}>
                                                        Download
                                                    </a>
                                                </div>
                                            )}
                                            <div className="sidebar-flight-actions">
                                                <button className="btn btn-sm" onClick={(e) => { e.stopPropagation(); startRename(flight.id); }} style={{background: 'var(--bg-secondary)', color: 'var(--text-secondary)', border: '1px solid var(--border)', padding: '0.2rem 0.5rem', fontSize: '0.7rem'}}>Rename</button>
                                                <button className="btn btn-sm" onClick={(e) => { e.stopPropagation(); duplicateFlight(flight.id); }} style={{background: 'var(--bg-secondary)', color: 'var(--text-secondary)', border: '1px solid var(--border)', padding: '0.2rem 0.5rem', fontSize: '0.7rem'}}>Duplicate</button>
                                                <button className="btn btn-sm" onClick={(e) => { e.stopPropagation(); deleteFlight(flight.id); }} style={{background: 'var(--bg-secondary)', color: '#dc2626', border: '1px solid var(--border)', padding: '0.2rem 0.5rem', fontSize: '0.7rem'}}>Delete</button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                            {savedFlights.length > 0 && (
                                <div style={{marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border)'}}>
                                    <button className="btn btn-sm" onClick={exportFlightsToFile} style={{width: '100%', background: 'var(--bg-secondary)', color: 'var(--text-secondary)', border: '1px solid var(--border)', padding: '0.5rem', fontSize: '0.75rem', justifyContent: 'center'}}>
                                        📤 Export Flights to File
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Content Area */}
                        {!currentFlightId ? (
                            /* Welcome Screen */
                            <div className="welcome-screen">
                                <h2 style={{fontSize: '1.5rem', color: 'var(--text-primary)', marginBottom: '0.5rem'}}>Welcome</h2>
                                <p style={{color: 'var(--text-muted)', marginBottom: '2rem'}}>Create a new flight application or select one from the sidebar</p>
                                <button className="btn btn-primary" onClick={() => { setSaveName(''); setShowSaveModal(true); }} style={{padding: '0.85rem 1.75rem', fontSize: '1rem'}}>
                                    + New Flight Application
                                </button>
                            </div>
                        ) : (
                            /* Flight Editor - Form and Map panels */
                            <>
                        {/* Left Panel - Form */}
                        <div className="panel">
                            <div className="panel-header">
                                <span>Application Details</span>
                                <button className="btn btn-sm btn-success" onClick={saveFlight}>💾 Save</button>
                            </div>
                            <div className="tabs">
                                <div className={"tab" + (activeTab === 'operator' ? ' active' : '')} onClick={() => setActiveTab('operator')}>Operator</div>
                                <div className={"tab" + (activeTab === 'flight' ? ' active' : '')} onClick={() => setActiveTab('flight')}>Flight Details</div>
                                <div className={"tab" + (activeTab === 'zone' ? ' active' : '')} onClick={() => setActiveTab('zone')}>Zone & Time</div>
                            </div>
                            <div className="panel-body">
                                {activeTab === 'operator' && (
                                    <div className="form-grid">
                                        <div className="form-group full-width">
                                            <label>UAS Operator Name <span style={{color: 'var(--accent-dark)', fontSize: '0.7rem'}}>✓ Locked</span></label>
                                            <input type="text" value={formData.operatorName} readOnly style={{background: 'var(--accent-light)', color: 'var(--accent-dark)'}} />
                                        </div>
                                        <div className="form-group">
                                            <label>Registration Number <span style={{color: 'var(--accent-dark)', fontSize: '0.7rem'}}>✓ Locked</span></label>
                                            <input type="text" value={formData.registrationNumber} readOnly style={{background: 'var(--accent-light)', color: 'var(--accent-dark)'}} />
                                        </div>
                                        <div className="form-group">
                                            <label>OA Number <span style={{color: 'var(--accent-dark)', fontSize: '0.7rem'}}>✓ Locked</span></label>
                                            <input type="text" value={formData.authNumber} readOnly style={{background: 'var(--accent-light)', color: 'var(--accent-dark)'}} />
                                            <small>Specific Category Operations</small>
                                        </div>
                                        <div className="form-group">
                                            <label>SAIL <span style={{color: 'var(--accent-dark)', fontSize: '0.7rem'}}>✓ Locked</span></label>
                                            <input type="text" value={formData.sailLevel} readOnly style={{background: 'var(--accent-light)', color: 'var(--accent-dark)'}} />
                                        </div>
                                        <div className="form-group">
                                            <label>VLOS / BVLOS <span style={{color: 'var(--accent-dark)', fontSize: '0.7rem'}}>✓ VLOS</span></label>
                                            <input type="text" value="VLOS" readOnly style={{background: 'var(--accent-light)', color: 'var(--accent-dark)'}} />
                                        </div>
                                        <div className="form-group full-width">
                                            <label>UAS Model</label>
                                            <select value={formData.uasModel} onChange={(e) => updateForm('uasModel', e.target.value)}>
                                                {UAS_MODELS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div className="form-group full-width">
                                            <label>Remote Pilot(s)</label>
                                            <div style={{display: 'flex', gap: '1rem', flexWrap: 'wrap', padding: '0.75rem', background: 'var(--bg-secondary)', borderRadius: '8px', border: '1px solid var(--border)'}}>
                                                {PILOTS.map(pilot => (
                                                    <label key={pilot.id} style={{display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer'}}>
                                                        <input
                                                            type="checkbox"
                                                            checked={selectedPilots.includes(pilot.id)}
                                                            onChange={() => togglePilot(pilot.id)}
                                                            style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                                        />
                                                        <span>{pilot.name}</span>
                                                    </label>
                                                ))}
                                            </div>
                                            {formData.pilotNames && <small style={{color: 'var(--accent-dark)'}}>Selected: {formData.pilotNames}</small>}
                                        </div>
                                        <div className="form-group">
                                            <label>Mobile Phone (Primary)</label>
                                            <select value={formData.phonePrimary} onChange={(e) => updateForm('phonePrimary', e.target.value)}>
                                                {PHONE_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>Mobile Phone (Alternate)</label>
                                            <select value={formData.phoneAlternate} onChange={(e) => updateForm('phoneAlternate', e.target.value)}>
                                                {PHONE_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'zone' && (
                                    <div className="form-grid">
                                        <div className="form-group full-width">
                                            <label>Detected Airspace Zones</label>
                                            {formData.detectedZones ? (
                                                <div style={{background: 'var(--accent-light)', border: '1px solid var(--accent)', borderRadius: '8px', padding: '0.75rem'}}>
                                                    {JSON.parse(formData.detectedZones).map((zone, idx) => (
                                                        <div key={idx} style={{display: 'flex', alignItems: 'center', gap: '8px', marginBottom: idx < JSON.parse(formData.detectedZones).length - 1 ? '8px' : 0}}>
                                                            <span style={{background: zone.type === 'PROHIBITED' ? '#ff0000' : zone.type === 'CONDITIONAL' ? '#ffeb3b' : '#ff9800', color: zone.type === 'CONDITIONAL' ? '#000' : '#fff', padding: '2px 8px', borderRadius: '4px', fontSize: '11px', fontWeight: '600'}}>{zone.id}</span>
                                                            <span style={{fontSize: '13px'}}>{zone.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div style={{background: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: '8px', padding: '0.75rem', color: 'var(--text-muted)', fontSize: '0.8rem'}}>
                                                    Draw a flight area on the map to auto-detect zones
                                                </div>
                                            )}
                                        </div>
                                        <div className="form-group">
                                            <label>Zone ID(s)</label>
                                            <input type="text" value={formData.zoneId} onChange={(e) => updateForm('zoneId', e.target.value)} placeholder="Auto-detected from map" readOnly style={{background: 'var(--bg-secondary)'}} />
                                        </div>
                                        <div className="form-group">
                                            <label>Zone Name(s)</label>
                                            <input type="text" value={formData.zoneName} onChange={(e) => updateForm('zoneName', e.target.value)} placeholder="Auto-detected from map" readOnly style={{background: 'var(--bg-secondary)'}} />
                                        </div>
                                        <div className="form-group full-width">
                                            <label>Description of the Area</label>
                                            <input type="text" value={formData.areaDescription} onChange={(e) => updateForm('areaDescription', e.target.value)} placeholder="e.g., Dublin 8" />
                                        </div>
                                        <div className="form-group">
                                            <label>Maximum Altitude (AMSL)</label>
                                            <input type="text" value={formData.maxAltitude} onChange={(e) => updateForm('maxAltitude', e.target.value)} placeholder="e.g. 600ft" />
                                            <small>Auto-calculated from terrain + AGL (editable)</small>
                                        </div>
                                        <div className="form-group">
                                            <label>Maximum Height (AGL)</label>
                                            <input type="text" value={formData.maxHeight} onChange={(e) => updateForm('maxHeight', e.target.value)} placeholder="e.g., 400ft" />
                                            <small>Above Ground Level</small>
                                        </div>
                                        <div className="form-group full-width">
                                            <label>Proposed Date(s) & Time(s) (Local)</label>
                                            <div className="datetime-row">
                                                <div className="form-group">
                                                    <small style={{marginBottom: '4px', display: 'block'}}>Start</small>
                                                    <input type="datetime-local" value={formData.startDateTime} onChange={(e) => handleDateTimeChange('startDateTime', e.target.value)} />
                                                </div>
                                                <div className="form-group">
                                                    <small style={{marginBottom: '4px', display: 'block'}}>End</small>
                                                    <input type="datetime-local" value={formData.endDateTime} onChange={(e) => handleDateTimeChange('endDateTime', e.target.value)} />
                                                </div>
                                            </div>
                                            {formData.proposedDateTime && <small style={{color: 'var(--accent-dark)', marginTop: '0.5rem', display: 'block'}}>📅 {formData.proposedDateTime}</small>}
                                        </div>
                                        <div className="form-group">
                                            <label>Duration (HH:MM)</label>
                                            <input type="text" value={formData.duration} onChange={(e) => updateForm('duration', e.target.value)} placeholder="e.g., 4:00" />
                                            <small>Auto-calculated or manual</small>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'flight' && (
                                    <div>
                                        {(!formData.startDateTime || !formData.endDateTime) && (
                                            <div style={{marginBottom: '12px', padding: '12px 14px', background: '#fff5f5', border: '1px solid #fc8181', borderRadius: '8px', color: '#742a2a', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '10px'}}>
                                                <span style={{fontSize: '18px'}}>⚠️</span>
                                                <span style={{flex: 1}}><strong>Set your proposed dates first.</strong> Zone detection filters dormant event-based zones by flight time.</span>
                                                <button className="btn btn-sm btn-primary" onClick={() => setActiveTab('zone')}>Go to Zone &amp; Time</button>
                                            </div>
                                        )}
                                        <div className="map-instructions">
                                            <strong>📍 How to define your flight area:</strong><br/>
                                            1. Choose Circle or Polygon below, OR import a KML file<br/>
                                            2. Use the drawing tool on the map (top right)<br/>
                                            3. For polygon: click to add points, double-click to finish<br/>
                                            4. For circle: click center, drag to set radius
                                        </div>
                                        <div style={{marginBottom: '1rem', padding: '0.75rem', background: 'var(--bg-secondary)', borderRadius: '8px', border: '1px dashed var(--border)'}}>
                                            <label style={{display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer'}}>
                                                <span style={{fontSize: '20px'}}>📂</span>
                                                <span><strong>Import KML File</strong> - Load flight area from file</span>
                                                <input type="file" accept=".kml,.kmz" onChange={handleKMLImport} style={{display: 'none'}} />
                                                <span className="btn btn-sm btn-primary" style={{marginLeft: 'auto'}}>Choose File</span>
                                            </label>
                                        </div>
                                        <div className="shape-toggle">
                                            <div className={"shape-btn" + (shapeType === 'polygon' ? ' active' : '')} onClick={() => setShapeType('polygon')}>
                                                <span className="shape-btn-icon">⬡</span>
                                                Polygon
                                            </div>
                                            <div className={"shape-btn" + (shapeType === 'circle' ? ' active' : '')} onClick={() => setShapeType('circle')}>
                                                <span className="shape-btn-icon">⭕</span>
                                                Circle
                                            </div>
                                        </div>
                                        <button className="btn btn-secondary btn-sm" onClick={clearDrawing} style={{marginBottom: '12px'}}>🗑️ Clear Drawing</button>
                                        {circleData && (
                                            <div className="form-grid" style={{marginBottom: '16px'}}>
                                                <div className="form-group">
                                                    <label>Circle Centre</label>
                                                    <input type="text" value={formData.circleCenter} readOnly />
                                                </div>
                                                <div className="form-group">
                                                    <label>Radius</label>
                                                    <input type="text" value={formData.circleRadius} readOnly />
                                                </div>
                                            </div>
                                        )}
                                        {coordinates.length > 0 && (
                                            <div className="coordinates-display">
                                                <strong>Polygon Coordinates (WGS-84 DMS):</strong>
                                                <pre>{formData.polygonCoords}</pre>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right Panel - Map */}
                        <div className="panel panel-fit">
                            <div className="panel-header">
                                <span>Flight Area Map</span>
                                <div className="btn-group">
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([53.3498, -6.2603], 12)}>Dublin</button>
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([53.4264, -6.2499], 13)}>DUB Airport</button>
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([51.8985, -8.4756], 12)}>Cork</button>
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([52.6992, -8.9249], 12)}>Shannon</button>
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([53.2707, -9.0568], 12)}>Galway</button>
                                    <button className="btn btn-secondary btn-sm" onClick={() => mapInstanceRef.current?.setView([52.6638, -8.6267], 12)}>Limerick</button>
                                </div>
                            </div>
                            <div className="panel-body panel-body-map">
                                <div id="map" ref={mapRef}></div>
                                <div className="export-section">
                                    <div style={{fontSize: '0.8rem', fontWeight: '600', color: 'var(--text-secondary)', marginBottom: '0.75rem'}}>Export Options</div>
                                    <div className="export-grid">
                                        <div className="export-card" onClick={downloadScreenshot}>
                                            <div className="export-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
                                            <div className="export-card-title">Screenshot</div>
                                            <div className="export-card-desc">PNG image</div>
                                        </div>
                                        <div className="export-card" onClick={generateKML}>
                                            <div className="export-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
                                            <div className="export-card-title">KML File</div>
                                            <div className="export-card-desc">Flight volume</div>
                                        </div>
                                        <div className="export-card" onClick={generatePDF}>
                                            <div className="export-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
                                            <div className="export-card-title">PDF Form</div>
                                            <div className="export-card-desc">U.F.101 document</div>
                                        </div>
                                        <div className="export-card" onClick={exportAll} style={{background: 'var(--accent-light)', borderColor: 'var(--accent)'}}>
                                            <div className="export-card-icon" style={{color: 'var(--accent-dark)'}}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
                                            <div className="export-card-title">Export All</div>
                                            <div className="export-card-desc">Download all</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </>
                        )}
                    </div>

                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
