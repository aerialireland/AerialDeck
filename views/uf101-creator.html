         Upload with scripts/upload-uf101-assets.mjs. -->

    <!-- AERIALDECK: Inter, so the top bar matches the Flight Plan section.
         Applied to the header only — the rest of the page keeps its own type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <style>
        /* ============================================================
           AERIALDECK: restyled to match the Flight Plan section.
           Palette and component styles are taken from public/index.html —
           if the design changes there, mirror it here.

           Class names are unchanged from the original console, so none of
           the React below had to be touched.

           Watch the map container's proportions. Page 2 of the IAA PDF is a
           dom-to-image capture of that element at its on-screen size, drawn at
           a fixed 170mm width with the height following the source aspect
           ratio, clamped to ~206mm.

           Measured for this restyle: the map went from 620x517 (1.199) to
           617x537 (1.149), so the PDF image goes from 141.8mm to 148.0mm tall.
           Both are well under the clamp, so nothing is squashed — the image is
           just slightly taller. If a future change pushes it past ~206mm the
           image WILL distort, so re-measure if this layout is reworked.
           ============================================================ */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8faf8;
            --bg-card: #ffffff;
            --text-primary: #001803;
            --text-secondary: #3d5a40;
            --text-muted: #6b8a6e;
            --accent: #6ba671;
            --accent-light: #e8f5e9;
            --accent-dark: #4a8550;
            --border: #e0e8e0;
            --border-light: #f0f4f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            padding: 0.75rem calc((100% - 1600px) / 2 + 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e8e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-logo { height: 44px; width: auto; }
        .header-home-link { display: flex; align-items: center; }
        .header-section {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-left: 1rem;
            border-left: 1px solid var(--border);
        }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .header-link, .logout-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-family: inherit;
            text-decoration: none;
            line-height: 1.4;
        }
        .header-link:hover, .logout-btn:hover { background: var(--accent-light); color: var(--text-primary); }
        .read-only-pill {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.78rem; color: var(--text-secondary);
            padding: 0.35rem 0.6rem; border: 1px solid var(--border);
            border-radius: 999px; white-space: nowrap; cursor: default;
        }
        .read-only-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex: none; }

        /* Column proportions kept from the original so the map keeps its
           aspect ratio (see the note at the top). Padding now matches
           Flight Plan's .main-content so the columns line up with the header. */
        .main-layout {
            display: grid;
            grid-template-columns: 25fr 26fr 39fr;
            gap: 1rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 25fr 65fr; } }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; padding: 1rem; } .sidebar { display: none; } }

        /* Flights sidebar — white card, like Flight Plan's bento cards */
        .sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            /* Kept at the original value. The grid row height, and therefore the
               map panel's height, is set by whichever column is tallest — see
               the PDF note at the top of this stylesheet. */
            max-height: calc(100vh - 185px);
        }
        .sidebar-header {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .sidebar-flights { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -0.25rem; padding: 0 0.25rem; }
        .sidebar-search {
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            font-family: inherit;
            width: 110px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .sidebar-search::placeholder { color: var(--text-muted); }
        .sidebar-search:focus { outline: none; border-color: var(--accent); }

        /* Application cards — same treatment as Flight Plan's flight-plan-card */
        .sidebar-flight {
            padding: 0.85rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.6rem;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            transition: all 0.2s;
        }
        .sidebar-flight:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,24,3,0.08);
        }
        .sidebar-flight.active { border-color: var(--accent); background: var(--accent-light); }
        .sidebar-flight-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-flight-meta { font-size: 0.75rem; color: var(--text-muted); line-height: 1.45; }
        .sidebar-flight-actions { display: flex; gap: 0.35rem; margin-top: 0.6rem; }
        .sidebar-empty { text-align: center; padding: 2.5rem 1.25rem; color: var(--text-muted); font-size: 0.85rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal { background: var(--bg-card); border-radius: 16px; padding: 1.5rem; width: 400px; max-width: 90%; border: 1px solid var(--border); }
        .modal h3 { margin-bottom: 1rem; color: var(--text-primary); font-size: 1.1rem; font-weight: 600; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; grid-column: span 2;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 3.75rem;
        }
        .welcome-screen h2 { color: var(--text-primary); font-weight: 600; }
        .welcome-screen p { color: var(--text-muted); }

        /* Panels — Flight Plan's card treatment: flat white, hairline border */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: transparent;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }
        .panel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
        .panel-body-map { display: flex; flex-direction: column; overflow: hidden; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.35rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-group input:disabled, .form-group input[readonly] {
            background: var(--accent-light);
            color: var(--text-secondary);
        }
        .form-group small { display: block; color: var(--text-muted); font-size: 0.7rem; margin-top: 0.25rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--accent-light); }
        .btn-success { background: var(--accent); color: #fff; font-weight: 600; }
        .btn-success:hover { background: var(--accent-dark); }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* Do not change the map's size — see the note at the top of this block. */
        #map { flex: 1; min-height: 300px; border-radius: 12px; border: 1px solid var(--border); }
        .zones-control {
            background: var(--bg-card); padding: 0.35rem 0.6rem; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,24,3,0.25); cursor: pointer;
            font-size: 0.75rem; font-family: inherit; font-weight: 500;
            border: none; display: flex; align-items: center; gap: 0.25rem;
            color: var(--text-primary);
        }
        .zones-control:hover { background: var(--accent-light); }
        .zones-control.active { background: var(--accent); color: #fff; }
        .map-instructions {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--accent-dark);
        }
        .coordinates-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 1rem;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            max-height: 150px;
            overflow-y: auto;
        }
        .coordinates-display pre { white-space: pre-wrap; word-break: break-all; }
        .profile-badge { background: var(--accent-light); color: var(--accent-dark); padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.75rem; }

        .export-section { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .export-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
        .export-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .export-card:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,24,3,0.08);
        }
        .export-card-icon { font-size: 1.5rem; margin-bottom: 0.35rem; color: var(--text-secondary); }
        .export-card-title { font-weight: 600; color: var(--text-primary); font-size: 0.78rem; }
        .export-card-desc { font-size: 0.66rem; color: var(--text-muted); margin-top: 0.1rem; }

        /* Tabs — Flight Plan uses pills, not an underline */
        /* Vertical padding kept level with the original 12px .tab padding: the
           middle column sets the grid row height, and the map panel stretches to
           match — so making this taller would change the map's aspect ratio and
           therefore the screenshot on page 2 of the PDF. */
        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
        }
        .tab {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active { background: var(--accent-light); color: var(--accent-dark); }

        .shape-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .shape-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-primary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .shape-btn:hover { border-color: var(--accent); background: var(--accent-light); }
        .shape-btn.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }
        .shape-btn-icon { font-size: 1.5rem; display: block; margin-bottom: 0.25rem; }

        .toast {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            background: var(--text-primary);
            color: #fff;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(0,24,3,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .datetime-row { display: flex; gap: 0.75rem; align-items: flex-end; }
        .datetime-row .form-group { flex: 1; margin-bottom: 0; max-width: 200px; }
        .leaflet-draw-toolbar a {
            background-image: none !important;
            background-color: #fff;
            border: 1px solid var(--border);
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .leaflet-draw-draw-polygon::before { content: '⬡'; }
        .leaflet-draw-draw-circle::before { content: '⭕'; }
        .leaflet-draw-edit-edit::before { content: '✏️'; }
        .leaflet-draw-edit-remove::before { content: '🗑️'; }
        .leaflet-draw-actions a { background-image: none !important; }
    </style>
</head>

        // Convert decimal degrees to DMS
        function decimalToDMS(decimal, isLat) {
            const absolute = Math.abs(decimal);
            const degrees = Math.floor(absolute);
            const minutesFloat = (absolute - degrees) * 60;
            const minutes = Math.floor(minutesFloat);
            const seconds = ((minutesFloat - minutes) * 60).toFixed(2);
            const direction = isLat ? (decimal >= 0 ? 'N' : 'S') : (decimal >= 0 ? 'E' : 'W');
            return degrees + '° ' + minutes + "' " + seconds + '" ' + direction;
        }

        // Format coordinates for display

            return decimalToDMS(lat, true) + ', ' + decimalToDMS(lng, false);

            // At cutover, restore a real implementation here (posting to an AerialDeck
            // endpoint) and disable saving on the VPS in the SAME change, so there is
            // never a moment with two writers.
            const READ_ONLY = true;
            const saveFlightsToServer = async (flights) => {
                showToast('Read-only preview — save in the live console at uf101.aerial.ie');
                return false;
            };
            useEffect(() => { savedFlightsRef.current = savedFlights; }, [savedFlights]);
            useEffect(() => { formDataRef.current = formData; }, [formData]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const updateForm = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            // Handle pilot checkbox toggle
            const togglePilot = (pilotId) => {
                setSelectedPilots(prev => {
                    const newSelected = prev.includes(pilotId)
                        ? prev.filter(id => id !== pilotId)
                        : [...prev, pilotId];
                    const names = newSelected
                        .map(id => PILOTS.find(p => p.id === id)?.name)
                        .filter(Boolean)
                        .join(' & ');
                    updateForm('pilotNames', names);
                    return newSelected;
                });
            };

            const handleZoneChange = (zoneId) => {
                const zone = UAS_ZONES.find(z => z.id === zoneId);
                if (zone && zone.id !== 'custom') {
                    updateForm('zoneId', zone.id);
                    updateForm('zoneName', zone.name);
                } else {
                    updateForm('zoneId', '');
                    updateForm('zoneName', '');
                }
            };

            // Format datetime for display (D/MM/YY HH:MM)
            const formatDateTimeForDisplay = (isoString) => {
                if (!isoString) return '';
                const date = new Date(isoString);
                const day = date.getDate();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = String(date.getFullYear()).slice(-2);
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return day + '/' + month + '/' + year + ' ' + hours + ':' + minutes;
            };

            // Calculate duration between two datetimes
            const calculateDuration = (start, end) => {
                if (!start || !end) return '';
                const startDate = new Date(start);
                const endDate = new Date(end);
                const diffMs = endDate - startDate;
                if (diffMs < 0) return '';
                const hours = Math.floor(diffMs / (1000 * 60 * 60));
                const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return hours + ':' + String(minutes).padStart(2, '0');
            };

            // Handle datetime changes
            const handleDateTimeChange = (field, value) => {
                updateForm(field, value);
                const start = field === 'startDateTime' ? value : formData.startDateTime;
                const end = field === 'endDateTime' ? value : formData.endDateTime;
                if (start && end) {
                    const formattedStart = formatDateTimeForDisplay(start);
                    const formattedEnd = formatDateTimeForDisplay(end);
                    updateForm('proposedDateTime', formattedStart + ' - ' + formattedEnd);
                    updateForm('duration', calculateDuration(start, end));
                }
            };

            // Initialize Map
            useEffect(() => {
                // Check if map container exists and map needs init (or reinit after unmount)
                if (mapRef.current && (!mapInstanceRef.current || !mapRef.current.querySelector('.leaflet-container'))) {
                    // Clean up old instance if it exists
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                        drawnItemsRef.current = null;
                    }
                    const map = L.map(mapRef.current).setView([53.3498, -6.2603], 12);

                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        attribution: 'Tiles © Esri'
                    }).addTo(map);

                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                        attribution: ''
                    }).addTo(map);

                    const drawnItems = new L.FeatureGroup();
                    map.addLayer(drawnItems);
                    drawnItemsRef.current = drawnItems;
                    mapInstanceRef.current = map;
                    updateDrawControl(shapeType);

                    // Add zones toggle control
                    const ZonesControl = L.Control.extend({
                        options: { position: 'topleft' },
                        onAdd: function() {
                            const btn = L.DomUtil.create('button', 'zones-control');
                            btn.innerHTML = '🗺️ Zones';
                            btn.title = 'Toggle IAA Airspace Zones';
                            btn.onclick = function(e) {
                                e.stopPropagation();
                                e.preventDefault();
                                const isActive = btn.classList.toggle('active');
                                btn.innerHTML = isActive ? '🗺️ Zones ✓' : '🗺️ Zones';

                                if (isActive) {
                                    if (!zonesLayerRef.current && typeof IAA_ZONES_DATA !== 'undefined') {
                                        zonesLayerRef.current = L.geoJSON(IAA_ZONES_DATA, {
                                            interactive: false,
                                            style: () => ({ color: '#ffeb3b', weight: 2, fillOpacity: 0 })
                                        });
                                    }
                                    if (zonesLayerRef.current) {
                                        zonesLayerRef.current.addTo(map);
                                        zonesLayerRef.current.bringToBack();
                                    }
                                } else {
                                    if (zonesLayerRef.current) map.removeLayer(zonesLayerRef.current);
                                }
                            };
                            L.DomEvent.disableClickPropagation(btn);
                            return btn;
                        }
                    });
                    map.addControl(new ZonesControl());

                    map.on(L.Draw.Event.CREATED, (e) => {
                        // Require proposed dates before accepting any drawn shape. Zone detection
                        // filters dormant event-based zones (e.g. T1) by the flight time window,
                        // so without dates the detection would be misleading.
                        const fd = formDataRef.current || {};
                        if (!fd.startDateTime || !fd.endDateTime) {
                            showToast('⚠️ Please set proposed start & end dates in the Zone & Time tab first, then draw.');
                            return;
                        }
                        drawnItems.clearLayers();
                        const layer = e.layer;
                        drawnItems.addLayer(layer);
                        setDrawnLayer(layer);

                        if (e.layerType === 'circle') {
                            const center = layer.getLatLng();
                            const radius = layer.getRadius();
                            setCircleData({ center, radius });
                            setCoordinates([]);
                            updateForm('circleCenter', formatCoordinate(center.lat, center.lng));
                            updateForm('circleRadius', Math.round(radius) + 'm');
                            updateForm('polygonCoords', '');
                        } else if (e.layerType === 'polygon') {
                            const latlngs = layer.getLatLngs()[0];
                            setCoordinates(latlngs);
                            setCircleData(null);
                            const coordStr = latlngs.map((ll, i) =>
                                'Point ' + (i + 1) + ': ' + formatCoordinate(ll.lat, ll.lng)
                            ).join('\n');
                            updateForm('polygonCoords', coordStr);
                            updateForm('circleCenter', '');
                            updateForm('circleRadius', '');
                        }

                        // Detect intersecting zones and calculate terrain
                        detectIntersectingZones(layer, e.layerType);
                        calculateAMSL(layer, e.layerType);
                    });

                    // Handle shape edits (move, resize, reshape)
                    map.on(L.Draw.Event.EDITED, (e) => {
                        e.layers.eachLayer((layer) => {
                            const isCircle = layer instanceof L.Circle;
                            const layerType = isCircle ? 'circle' : 'polygon';

                            if (isCircle) {
                                const center = layer.getLatLng();
                                const radius = layer.getRadius();
                                setCircleData({ center, radius });
                                updateForm('circleCenter', formatCoordinate(center.lat, center.lng));
                                updateForm('circleRadius', Math.round(radius) + 'm');
                            } else {
                                const latlngs = layer.getLatLngs()[0];
                                setCoordinates(latlngs);
                                const coordStr = latlngs.map((ll, i) =>
                                    'Point ' + (i + 1) + ': ' + formatCoordinate(ll.lat, ll.lng)
                                ).join('\n');
                                updateForm('polygonCoords', coordStr);
                            }

                            // Recalculate zones and AMSL
                            detectIntersectingZones(layer, layerType);
                            calculateAMSL(layer, layerType);
                        });
                    });

                    // Draw shape if loading a flight
                    if (currentFlightId) {
                        const fl = savedFlightsRef.current.find(f => f.id === currentFlightId);
                        if (fl && fl.circle) {
                            const circ = L.circle([fl.circle.lat, fl.circle.lng], {radius: fl.circle.r, color: '#0c3210', fillColor: '#98d59f', fillOpacity: 0.3});
                            drawnItems.addLayer(circ);
                            setDrawnLayer(circ);
                            setCircleData({center: L.latLng(fl.circle.lat, fl.circle.lng), radius: fl.circle.r});
                            map.fitBounds(circ.getBounds(), {padding: [50, 50]});
                        } else if (fl && fl.coords && fl.coords.length > 0) {
                            const ll = fl.coords.map(x => L.latLng(x.lat, x.lng));
                            const poly = L.polygon(ll, {color: '#0c3210', fillColor: '#98d59f', fillOpacity: 0.3});
                            drawnItems.addLayer(poly);
                            setDrawnLayer(poly);
                            setCoordinates(ll);
                            map.fitBounds(poly.getBounds(), {padding: [50, 50]});
                        }
                    }
                }
                // Cleanup when switching away from flight view
                return () => {
                    if (mapInstanceRef.current && !mapRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                        drawnItemsRef.current = null;
                    }
                };
            }, [currentFlightId]);

            // Get terrain elevation using AWS Terrain Tiles
            const getTerrainElevation = async (lat, lng) => {
                const zoom = 12; // Good balance of accuracy and speed
                const n = Math.pow(2, zoom);
                const tileX = Math.floor((lng + 180) / 360 * n);
                const tileY = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);

                // Position within tile (0-256)
                const pixelX = Math.floor(((lng + 180) / 360 * n - tileX) * 256);
                const pixelY = Math.floor(((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n - tileY) * 256);

                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 256;
                        canvas.height = 256;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const pixel = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                        // AWS Terrarium format: elevation = (R * 256 + G + B / 256) - 32768
                        const elevation = (pixel[0] * 256 + pixel[1] + pixel[2] / 256) - 32768;
                        resolve(elevation);
                    };
                    img.onerror = () => resolve(null);
                    img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${zoom}/${tileX}/${tileY}.png`;
                });
            };

            // Calculate terrain elevation at center point and set AMSL
            const calculateAMSL = async (layer, layerType) => {
                try {
                    let centerPoint;

                    if (layerType === 'circle') {
                        const center = layer.getLatLng();
                        centerPoint = { lat: center.lat, lng: center.lng };
                    } else {
                        // Polygon - use centroid
                        const latlngs = layer.getLatLngs()[0];
                        centerPoint = latlngs.reduce((acc, ll) => ({ lat: acc.lat + ll.lat / latlngs.length, lng: acc.lng + ll.lng / latlngs.length }), { lat: 0, lng: 0 });
                    }

                    // Get elevation at center point only
                    const centerElevation = await getTerrainElevation(centerPoint.lat, centerPoint.lng);

                    if (centerElevation !== null) {
                        const centerElevationFt = Math.round(centerElevation * 3.28084); // Convert meters to feet

                        // Store terrain elevation for recalculation when AGL changes
                        updateForm('terrainElevation', centerElevationFt);

                        // Get AGL value (default 400ft if not set)
                        const aglStr = formData.maxHeight || '400ft';
                        const aglFt = parseInt(aglStr) || 400;

                        // Calculate AMSL from center terrain elevation
                        const amslFt = centerElevationFt + aglFt;
                        updateForm('maxAltitude', amslFt + 'ft');

                        showToast(`Terrain (center): ${centerElevationFt}ft + AGL: ${aglFt}ft = AMSL: ${amslFt}ft`);
                    }
                } catch (err) {
                    console.error('Terrain elevation error:', err);
                }
            };

            // Detect which IAA zones intersect with the drawn shape
            // A zone is "active" for a flight if the flight's time window overlaps any of the
            // zone's limitedApplicability windows. Zones without limitedApplicability (or with an
            // empty list) are treated as always-active. Event-based zones like T1 (Aviva Stadium)
            // only turn on during the published match/concert windows; filtering by time stops the
            // tool over-reporting which authorities a pilot actually needs to contact.
            const isZoneActiveForFlight = (feature, flightStartIso, flightEndIso) => {
                const la = feature.properties && feature.properties.limitedApplicability;
                if (!la || !Array.isArray(la) || la.length === 0) return true;
                if (!flightStartIso || !flightEndIso) return true; // no dates yet, be permissive
                const fs = new Date(flightStartIso).getTime();
                const fe = new Date(flightEndIso).getTime();
                if (isNaN(fs) || isNaN(fe)) return true;
                for (const w of la) {
                    const ws = new Date(w.startDateTime).getTime();
                    const we = new Date(w.endDateTime).getTime();
                    if (isNaN(ws) || isNaN(we)) continue;
                    // Half-open overlap: windows are inclusive-start, inclusive-end per IAA format.
                    if (fs <= we && fe >= ws) return true;
                }
                return false;
            };

            const detectIntersectingZones = (layer, layerType) => {
                if (typeof IAA_ZONES_DATA === 'undefined' || typeof turf === 'undefined') return;

                // Read dates from the ref so we get the latest values, not a stale closure.
                // If dates aren't set we skip detection entirely and prompt the user — this
                // guarantees every saved flight has its zone list filtered against a real
                // proposed time window, matching the IAA viewer's behaviour.
                const flightStart = (formDataRef.current && formDataRef.current.startDateTime) || '';
                const flightEnd = (formDataRef.current && formDataRef.current.endDateTime) || '';
                if (!flightStart || !flightEnd) {
                    showToast('⚠️ Enter proposed start & end dates in the Zone & Time tab before drawing.');
                    return;
                }

                try {
                    let drawnGeometry;
                    if (layerType === 'circle') {
                        // Convert circle to polygon for intersection check
                        const center = layer.getLatLng();
                        const radius = layer.getRadius();
                        drawnGeometry = turf.circle([center.lng, center.lat], radius / 1000, { units: 'kilometers', steps: 64 });
                    } else {
                        // Polygon
                        const latlngs = layer.getLatLngs()[0];
                        const coords = latlngs.map(ll => [ll.lng, ll.lat]);
                        coords.push(coords[0]); // Close the polygon
                        drawnGeometry = turf.polygon([coords]);
                    }

                    const intersectingZones = [];
                    let skippedDormant = 0;
                    IAA_ZONES_DATA.features.forEach(feature => {
                        try {
                            if (turf.booleanIntersects(drawnGeometry, feature)) {
                                if (isZoneActiveForFlight(feature, flightStart, flightEnd)) {
                                    intersectingZones.push({
                                        id: feature.properties.identifier,
                                        name: feature.properties.name,
                                        type: feature.properties.type
                                    });
                                } else {
                                    skippedDormant++;
                                }
                            }
                        } catch (e) {
                            // Skip invalid geometries
                        }
                    });

                    // Update form with detected zones
                    if (intersectingZones.length > 0) {
                        const zoneIds = intersectingZones.map(z => z.id).join(', ');
                        const zoneNames = intersectingZones.map(z => z.name).join(', ');
                        updateForm('zoneId', zoneIds);
                        updateForm('zoneName', zoneNames);
                        updateForm('detectedZones', JSON.stringify(intersectingZones));
                        const tail = skippedDormant > 0 ? ` (${skippedDormant} dormant zone${skippedDormant > 1 ? 's' : ''} skipped)` : '';
                        showToast(`Detected ${intersectingZones.length} zone(s): ${zoneIds}${tail}`);
                    } else {
                        updateForm('zoneId', '');
                        updateForm('zoneName', '');
                        updateForm('detectedZones', '');
                        const msg = skippedDormant > 0
                            ? `No active zones for this flight window (${skippedDormant} dormant zone${skippedDormant > 1 ? 's' : ''} overlap spatially but aren't active).`
                            : 'No restricted zones detected';
                        showToast(msg);
                    }
                } catch (err) {
                    console.error('Zone detection error:', err);
                }
            };

            const updateDrawControl = (type) => {
                if (!mapInstanceRef.current) return;
                if (drawControlRef.current) {
                    mapInstanceRef.current.removeControl(drawControlRef.current);
                }
                const drawOptions = {
                    position: 'topright',
                    draw: {
                        polyline: false,
                        rectangle: false,
                        marker: false,
                        circlemarker: false,
                        polygon: type === 'polygon' ? {
                            allowIntersection: false,
                            shapeOptions: { color: '#0c3210', fillColor: '#98d59f', fillOpacity: 0.3 }
                        } : false,
                        circle: type === 'circle' ? {
                            shapeOptions: { color: '#0c3210', fillColor: '#98d59f', fillOpacity: 0.3 }
                        } : false
                    },
                    edit: { featureGroup: drawnItemsRef.current, remove: true }
                };
                const drawControl = new L.Control.Draw(drawOptions);
                mapInstanceRef.current.addControl(drawControl);
                drawControlRef.current = drawControl;
            };

            useEffect(() => {
                if (mapInstanceRef.current) {
                    updateDrawControl(shapeType);
                }
            }, [shapeType]);

            // When the flight time window changes, re-run zone detection so dormant event-based
            // zones are added/removed as appropriate. We only re-detect if a layer is already
            // drawn *and* we're editing a fresh flight (currentFlightId is null) — loaded flights
            // keep their frozen detection to preserve the historical-zone invariant.
            useEffect(() => {
                if (currentFlightId) return;
                if (!formData.startDateTime || !formData.endDateTime) return;
                if (!drawnLayer) return;
                const isCircle = drawnLayer instanceof L.Circle;
                detectIntersectingZones(drawnLayer, isCircle ? 'circle' : 'polygon');
            }, [formData.startDateTime, formData.endDateTime]);

            // Recalculate AMSL when AGL (maxHeight) changes
            useEffect(() => {
                if (formData.terrainElevation) {
                    const terrainFt = parseInt(formData.terrainElevation) || 0;
                    const aglFt = parseInt(formData.maxHeight) || 400;
                    const amslFt = terrainFt + aglFt;
                    if (formData.maxAltitude !== amslFt + 'ft') {
                        updateForm('maxAltitude', amslFt + 'ft');
                    }
                }
            }, [formData.maxHeight]);

            const clearDrawing = () => {
                if (drawnItemsRef.current) {
                    drawnItemsRef.current.clearLayers();
                }
                setDrawnLayer(null);
                setCoordinates([]);
                setCircleData(null);
                updateForm('circleCenter', '');
                updateForm('circleRadius', '');
                updateForm('polygonCoords', '');
            };

            // KML Import
            const handleKMLImport = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Same date requirement as drawing — zone detection is time-sensitive.
                const fd = formDataRef.current || {};
                if (!fd.startDateTime || !fd.endDateTime) {
                    showToast('⚠️ Please set proposed start & end dates in the Zone & Time tab first, then import.');
                    e.target.value = '';
                    return;
                }

                try {
                    showToast('Importing KML...');
                    const text = await file.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, 'text/xml');

                    // Extract name/description
                    const nameEl = xml.querySelector('Placemark > name') || xml.querySelector('Document > name');
                    const descEl = xml.querySelector('Placemark > description') || xml.querySelector('Document > description');
                    const kmlName = nameEl ? nameEl.textContent.trim() : '';
                    const kmlDesc = descEl ? descEl.textContent.trim() : '';

                    // Extract polygon coordinates (including holes/inner boundaries).
                    // We accept three shapes, in priority order:
                    //   1. <Polygon> with <outerBoundaryIs><LinearRing><coordinates>
                    //   2. A bare <LinearRing><coordinates>
                    //   3. A <LineString><coordinates> that is already closed (first point == last point).
                    //      Some tools (including Google Earth's "Add Path" tool) export closed loops
                    //      as LineString rather than Polygon; we treat those as polygon outer boundaries.
                    //      Open LineStrings are rejected with a clearer message below.
                    const polygonEl = xml.querySelector('Polygon');
                    const lineStringCoordsEl = xml.querySelector('LineString coordinates');
                    let outerCoordsEl = xml.querySelector('outerBoundaryIs coordinates')
                        || xml.querySelector('Polygon coordinates')
                        || xml.querySelector('LinearRing coordinates');
                    let importedFromLineString = false;
                    let openLineString = false;

                    if (!outerCoordsEl && lineStringCoordsEl) {
                        // Parse the LineString's raw coordinates to test closure.
                        const rawPoints = lineStringCoordsEl.textContent
                            .trim()
                            .split(/\s+/)
                            .filter(p => p.includes(','));
                        if (rawPoints.length >= 4) {
                            const [lng1, lat1] = rawPoints[0].split(',').map(Number);
                            const [lng2, lat2] = rawPoints[rawPoints.length - 1].split(',').map(Number);
                            // ~1e-6 degrees ≈ 0.11m at the equator — tight enough to catch only
                            // genuinely closed loops but tolerant of floating-point round-trip drift.
                            const TOL = 1e-6;
                            const isClosed = Math.abs(lng1 - lng2) < TOL && Math.abs(lat1 - lat2) < TOL;
                            if (isClosed) {
                                outerCoordsEl = lineStringCoordsEl;
                                importedFromLineString = true;
                            } else {
                                openLineString = true;
                            }
                        } else {
                            openLineString = true;
                        }
                    }

                    if (outerCoordsEl) {
                        // Parse outer boundary
                        const parseCoords = (coordText) => {
                            const points = coordText.trim().split(/\s+/).filter(p => p.includes(','));
                            return points.map(p => {
                                const [lng, lat] = p.split(',').map(Number);
                                return L.latLng(lat, lng);
                            });
                        };

                        const outerLatlngs = parseCoords(outerCoordsEl.textContent);

                        // Check for inner boundaries (holes)
                        const innerBoundaries = polygonEl ? polygonEl.querySelectorAll('innerBoundaryIs coordinates') : [];
                        const holes = [];
                        innerBoundaries.forEach(innerEl => {
                            const holeLatlngs = parseCoords(innerEl.textContent);
                            if (holeLatlngs.length > 0) {
                                holes.push(holeLatlngs);
                            }
                        });

                        // For Leaflet polygon with holes: [outerRing, hole1, hole2, ...]
                        const latlngs = holes.length > 0 ? [outerLatlngs, ...holes] : outerLatlngs;

                        if (outerLatlngs.length > 0) {
                            // Clear existing and draw polygon
                            clearDrawing();
                            setShapeType('polygon');

                            const poly = L.polygon(latlngs, {color: '#0c3210', fillColor: '#98d59f', fillOpacity: 0.3});
                            if (drawnItemsRef.current) {
                                drawnItemsRef.current.addLayer(poly);
                            }
                            setDrawnLayer(poly);
                            // Store outer boundary as main coordinates
                            setCoordinates(outerLatlngs);

                            // Update form fields - show outer boundary points
                            let coordStr = outerLatlngs.map((ll, i) =>
                                'Point ' + (i + 1) + ': ' + formatCoordinate(ll.lat, ll.lng)
                            ).join('\n');
                            if (holes.length > 0) {
                                coordStr += '\n\n--- HOLE (excluded area) ---\n';
                                holes.forEach((hole, holeIdx) => {
                                    if (holes.length > 1) coordStr += 'Hole ' + (holeIdx + 1) + ':\n';
                                    coordStr += hole.map((ll, i) =>
                                        'Point ' + (i + 1) + ': ' + formatCoordinate(ll.lat, ll.lng)
                                    ).join('\n');
                                });
                            }
                            updateForm('polygonCoords', coordStr);

                            // Update area description if available
                            if (kmlName && !formData.areaDescription) {
                                updateForm('areaDescription', kmlName);
                            }

                            // Fit map to bounds
                            if (mapInstanceRef.current) {
                                mapInstanceRef.current.fitBounds(poly.getBounds(), {padding: [50, 50]});
                            }

                            // Detect intersecting zones
                            detectIntersectingZones(poly, 'polygon');

                            // Calculate AMSL from terrain elevation
                            calculateAMSL(poly, 'polygon');

                            const holeInfo = holes.length > 0 ? ' (with ' + holes.length + ' hole' + (holes.length > 1 ? 's' : '') + ')' : '';
                            const sourceInfo = importedFromLineString ? ' (converted from closed path)' : '';
                            showToast('KML imported: ' + (kmlName || 'Polygon with ' + outerLatlngs.length + ' points') + holeInfo + sourceInfo);
                        }
                    } else if (openLineString) {
                        // We found a LineString but its first/last points don't match, so it's an
                        // open path rather than a closed flight boundary. Tell the user what to do.

                const fl = {id: Date.now().toString(), name: nm, zoneName: '', savedAt: new Date().toISOString(), geojsonVersion: getGeojsonVersion(), formData: defaultData, selectedPilots: ['tk', 'roc'], shapeType: 'polygon', coords: [], circle: null};
                const upd = [fl, ...savedFlights];
                setSavedFlights(upd); saveFlightsToServer(upd);
                setFormData(defaultData); setSelectedPilots(['tk', 'roc']); setShapeType('polygon'); clearDrawing();
                setCurrentFlightId(fl.id);
                setShowSaveModal(false); setSaveName(''); showToast('Created: ' + nm);
            };
            const loadFlight = (id) => {
                const fl = savedFlightsRef.current.find(f => f.id === id);

            const duplicateFlight = (id) => { const original = savedFlights.find(f => f.id === id); if (!original) return; const newId = Date.now().toString(); const copy = {...original, id: newId, name: original.name + ' (copy)', savedAt: new Date().toISOString(), formData: {...original.formData}, selectedPilots: [...(original.selectedPilots || [])], coords: original.coords ? original.coords.map(c => ({...c})) : null, circle: original.circle ? {...original.circle} : null}; const upd = [copy, ...savedFlights]; setSavedFlights(upd); saveFlightsToServer(upd); showToast('Duplicated: ' + copy.name); };
            const startRename = (id) => { const fl = savedFlights.find(f => f.id === id); if (fl) { setRenameFlightId(id); setRenameName(fl.name); setShowRenameModal(true); } };
            const confirmRename = () => { if (!renameFlightId) return; const newName = renameName.trim() || 'Unnamed Flight'; const upd = savedFlights.map(f => f.id === renameFlightId ? {...f, name: newName} : f); setSavedFlights(upd); saveFlightsToServer(upd); setShowRenameModal(false); setRenameFlightId(null); setRenameName(''); showToast('Renamed to: ' + newName); };
            const newFlight = () => { setCurrentFlightId(null); setFormData({operatorName: COMPANY.operatorName, registrationNumber: COMPANY.registrationNumber, authNumber: COMPANY.authNumber, sailLevel: 'SORA - SAIL II', vlosBvlos: 'VLOS', uasModel: 'DJI Mavic 3 Pro', pilotNames: "Tony Kinlan & Rob O'Connor", phonePrimary: '0861649569', phoneAlternate: '0877582972', zoneId: '', zoneName: '', detectedZones: '', areaDescription: '', maxAltitude: '', maxHeight: '400ft', startDateTime: '', endDateTime: '', proposedDateTime: '', duration: '', circleCenter: '', circleRadius: '', polygonCoords: ''}); setSelectedPilots(['tk', 'roc']); clearDrawing(); showToast('New flight'); };

            // Capture map screenshot
            const captureMapScreenshot = async () => {

                } catch (err) { console.error(err); showToast('Screenshot error'); return null; }

            const downloadScreenshot = async () => {

            // Export all flights to JSON file
            const exportFlightsToFile = () => {

            };

            // Escape text for safe inclusion in XML/KML element content.
            // Without this, characters like & in area descriptions (e.g. "Docklands & Quays")
            // produce KML that strict parsers (Google Earth, QGIS) reject as not well-formed.
            const xmlEscape = (str) => String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');

            const generateKML = () => {
                const areaDesc = formData.areaDescription || 'Unnamed';
                let kmlContent = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n';
                kmlContent += '<name>UAS Flight Area - ' + xmlEscape(areaDesc) + '</name>\n';
                kmlContent += '<description>U.F.101 Application - ' + xmlEscape(formData.operatorName) + '</description>\n';
                kmlContent += '<Style id="flightArea"><LineStyle><color>ffb36600</color><width>3</width></LineStyle><PolyStyle><color>4db36600</color></PolyStyle></Style>\n';

                if (circleData) {
                    const center = circleData.center;
                    const radius = circleData.radius;
                    const points = 36;
                    let coords = '';
                    for (let i = 0; i <= points; i++) {
                        const angle = (i / points) * 2 * Math.PI;
                        const lat = center.lat + (radius / 111320) * Math.cos(angle);
                        const lng = center.lng + (radius / (111320 * Math.cos(center.lat * Math.PI / 180))) * Math.sin(angle);
                        coords += lng + ',' + lat + ',0\n';
                    }
                    kmlContent += '<Placemark><name>Flight Area (Circle)</name><styleUrl>#flightArea</styleUrl>\n';
                    kmlContent += '<Polygon><outerBoundaryIs><LinearRing><coordinates>\n' + coords + '</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n';
                } else if (coordinates.length > 0) {
                    let coords = coordinates.map(ll => ll.lng + ',' + ll.lat + ',0').join('\n');
                    coords += '\n' + coordinates[0].lng + ',' + coordinates[0].lat + ',0';
                    kmlContent += '<Placemark><name>Flight Area (Polygon)</name><styleUrl>#flightArea</styleUrl>\n';
                    kmlContent += '<Polygon><outerBoundaryIs><LinearRing><coordinates>\n' + coords + '\n</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n';
                }

                kmlContent += '</Document>\n</kml>';
                const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
                // Strip characters that aren't safe in filenames (not the same as XML-unsafe chars).
                const safeFilenamePart = areaDesc.replace(/[\\/:*?"<>|&]/g, '_').trim() || 'location';

            // Generate PDF matching exact IAA template
            const generatePDF = async () => {
                showToast('Generating PDF...');

                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = 210;
                    const pageHeight = 297;

                    const contentWidth = pageWidth - (margin * 2);
                    const issueDate = '04/11/2025';

                    // Helper function to draw the header table on each page
                    const drawHeader = (pageNum) => {
                        const headerHeight = 28;
                        const logoWidth = 35;
                        const col2Width = 45;
                        const col3Width = contentWidth - logoWidth - col2Width;

                        // Outer border
                        doc.setDrawColor(0);
                        doc.setLineWidth(0.5);
                        doc.rect(margin, margin, contentWidth, headerHeight);

                        // Logo cell vertical line
                        doc.line(margin + logoWidth, margin, margin + logoWidth, margin + headerHeight);

                        // Add IAA logo
                        try {
                            doc.addImage(IAA_LOGO_BASE64, 'JPEG', margin + 4, margin + 2, 28, 24);
                        } catch(e) {
                            console.warn('Could not add logo:', e);
                        }

                        // Column 2 - Form details (4 rows)
                        const rowHeight = headerHeight / 4;
                        doc.line(margin + logoWidth + col2Width, margin, margin + logoWidth + col2Width, margin + headerHeight);

                        // Row lines in col2
                        doc.setLineWidth(0.3);
                        for (let i = 1; i < 4; i++) {
                            doc.line(margin + logoWidth, margin + (rowHeight * i), margin + logoWidth + col2Width, margin + (rowHeight * i));
                        }

                        // Text in column 2
                        doc.setFontSize(9);
                        doc.setFont('helvetica', 'normal');
                        doc.text('Form No. U.F.101', margin + logoWidth + 2, margin + 5);
                        doc.text('Version No. 13', margin + logoWidth + 2, margin + rowHeight + 5);
                        doc.text('Issue Date ' + issueDate, margin + logoWidth + 2, margin + (rowHeight * 2) + 5);
                        doc.text('Page ' + pageNum + ' of 3', margin + logoWidth + 2, margin + (rowHeight * 3) + 5);

                        // Column 3 - Title (right-aligned in cell, centered vertically)
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'bold');
                        const titleX = margin + logoWidth + col2Width + (col3Width / 2);

                        doc.text('Prohibited Area', titleX, margin + 20, { align: 'center' });

                        return margin + headerHeight + 3;
                    };

                    // Helper to draw a form row with proper styling
                    const drawFormRow = (y, label, value, rowHeight = 8, labelItalicPart = '', valueFontSize = 9) => {
                        const labelWidth = contentWidth * 0.45;

                        // Draw horizontal line at top of row
                        doc.setDrawColor(150, 150, 150);
                        doc.setLineWidth(0.2);
                        doc.line(margin, y, margin + contentWidth, y);

                        // Label text
                        doc.setFontSize(9);
                        doc.setFont('helvetica', 'bold');

                        // Handle multi-line labels
                        if (label.includes('\n')) {
                            const lines = label.split('\n');
                            let textY = y + 4;
                            lines.forEach((line, idx) => {
                                if (idx === 0) {
                                    doc.setFont('helvetica', 'bold');
                                } else {
                                    doc.setFont('helvetica', 'italic');
                                }
                                doc.text(line, margin + 2, textY);
                                textY += 3.5;
                            });
                        } else {
                            doc.text(label, margin + 2, y + 5.5);
                        }

                        // Value text
                        doc.setFontSize(valueFontSize);
                        doc.setFont('helvetica', 'normal');
                        const valueWidth = contentWidth - labelWidth - 4;
                        const valueLines = doc.splitTextToSize(value || '', valueWidth);

                            // Multiple lines - render each
                            valueLines.forEach((line, idx) => {
                                doc.text(line, margin + labelWidth + 2, y + 4 + (idx * 3.5));
                            });
                            // Return extra height for wrapped text
                            return y + Math.max(rowHeight, valueLines.length * 3.5 + 2);
                        } else {
                            doc.text(value || '', margin + labelWidth + 2, y + 5.5);
                            return y + rowHeight;
                        }
                    };

                    // ============ PAGE 1 ============
                    let y = drawHeader(1);

                    // Small "pre" text (matching template artifact)
                    doc.setFontSize(8);
                    doc.setFont('helvetica', 'normal');
                    doc.text('pre', pageWidth / 2, y + 2, { align: 'center' });
                    y += 4;

                    // Intro text
                    doc.setFontSize(7.5);
                    doc.setFont('helvetica', 'normal');
                    const introText = 'This Form is for the use by UAS Operators when applying to the relevant UAS Geographical Zone Authority to conduct UAS Operations within UAS Geographical Zone Prohibited or Restricted Area*. Contact details available on https://www.iaa.ie/drones/uas-geographic-zones.';
                    const introLines = doc.splitTextToSize(introText, contentWidth);
                    doc.text(introLines, margin, y + 3);
                    y += 10;

                    // Blue header row
                    doc.setFillColor(189, 215, 238);
                    doc.rect(margin, y, contentWidth, 7, 'F');

                    doc.setLineWidth(0.3);
                    doc.rect(margin, y, contentWidth, 7);
                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(192, 0, 0);
                    doc.text('UAS Operations Application Form - UAS Geographical Zone Prohibited / Restricted Area', margin + 3, y + 5);

                    y += 7;

                    y = drawFormRow(y, 'UAS Geographical Zone ID', formData.zoneId);
                    y = drawFormRow(y, 'UAS Geographical Zone Name', formData.zoneName);
                    y = drawFormRow(y, 'Description of the Area (townland, landmark, etc.)', formData.areaDescription);
                    y = drawFormRow(y, 'Maximum Altitude (AMSL)', formData.maxAltitude);
                    y = drawFormRow(y, 'Maximum Height Above Ground Level (AGL)', formData.maxHeight);
                    y = drawFormRow(y, 'Proposed Date(s) & Time(s) (Local)', formData.proposedDateTime);
                    y = drawFormRow(y, 'Duration (HH:MM)', formData.duration);
                    // Derive the circle/polygon row values from the live drawing state rather than

                    const pdfCircleCenter = hasCircle

                        : '';
                    const pdfCircleRadius = hasCircle
                        ? (formData.circleRadius || (Math.round(circleData.radius) + 'm'))
                        : '';
                    const pdfPolygonValue = hasPolygon ? 'Attached' : '';
                    y = drawFormRow(y, 'Circle Centre Latitude & Longitude\n(Degrees, Minutes & Seconds WGS-84)', pdfCircleCenter, 10);
                    y = drawFormRow(y, 'Circle Radius of Operation (m)', pdfCircleRadius);
                    y = drawFormRow(y, 'OR Polygon Latitudes & Longitudes\n(Degrees, Minutes & Seconds WGS-84)', pdfPolygonValue, 10);

                    // Final bottom line for table
                    doc.setDrawColor(150, 150, 150);
                    doc.line(margin, y, margin + contentWidth, y);

                    // Footer note
                    y += 6;
                    doc.setFontSize(8);
                    doc.setFont('helvetica', 'bolditalic');
                    doc.setTextColor(192, 0, 0);
                    const footerNote = '* N.B. Certain UAS Geographical Zones only allow access requests from specific category operators. For more information, including contact details of zone authorities, please refer to www.iaa.ie/drones.';
                    const footerLines = doc.splitTextToSize(footerNote, contentWidth - 20);
                    doc.text(footerLines, pageWidth / 2, y, { align: 'center' });

                    doc.setLineWidth(0.5);
                    doc.rect(margin, y, contentWidth, mapBoxHeight);

                    // Map section title
                    doc.setFontSize(12);

                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'italic');

                    doc.setFont('helvetica', 'bold');

                    doc.text('Additional Zone Authority Requirements', pageWidth / 2, y + 12, { align: 'center' });

                    // Signature box
                    doc.setFillColor(255, 255, 255);

                    doc.setFont('helvetica', 'normal');

                    const filename = 'UF101_' + (formData.areaDescription || 'Application') + '_' + new Date().toISOString().split('T')[0] + '.pdf';
                    doc.save(filename);
                    showToast('PDF downloaded: ' + filename);

                } catch (error) {
                    console.error('PDF generation error:', error);
                    showToast('Error generating PDF: ' + error.message);
                }
            };

            const exportAll = async () => {
                showToast('Generating all exports...');

            return (
                <div className="app-wrapper">

                                <span className="read-only-dot"></span>
